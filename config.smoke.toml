[geo]
max_lat = 30.72
max_lon = 104.172227
min_lat = 30.60
min_lon = 103.98

[simulation]
passenger_file = "data/filtered_passengers_selected.csv"
num_cars = 20
distance_threshold_m = 1000.0
position_update_interval_s = 10
start_time_s = 3600
end_time_s = 3900
batch_interval_s = 10
dispatch_cycle_s = 120
sample_size = 100
random_seed = 42
visualization = false
visualization_step_delay_ms = 0
keep_visualization_alive = false

[osrm]
base_url = "http://127.0.0.1:5001"
profile = "driving"
max_concurrency = 16

[python]
algorithm_dir = "python_algorithms"
h3_resolution = 7

[python.matching]
name = "maximum"

[python.matching.maximum]

[python.matching.nearest]
strategy = "passenger"
max_matches = 0

[python.dispatch]
name = "none"

[python.dispatch.ppo]
model_path = "models/ppo_ridesharing_model.zip"
deterministic = true

[python.dispatch.sac]
model_path = "models/sac_ridesharing_model.zip"
deterministic = true

[python.dispatch.none]

[python.dispatch.random]

[training]
algorithm = "ppo"

[training.ppo]
total_timesteps = 20
output_path = "models/ppo_ridesharing_model"
n_steps = 12
batch_size = 6
learning_rate = 1e-5
clip_range = 0.02
ent_coef = 0.0005
gamma = 0.99
verbose = 1

[training.sac]
total_timesteps = 20
output_path = "models/sac_ridesharing_model"
learning_rate = 0.0003
buffer_size = 1000
learning_starts = 10
batch_size = 16
tau = 0.005
gamma = 0.99
train_freq = 1
gradient_steps = 1
verbose = 1

[visualization]
host = "127.0.0.1"
port = 8000
vector_style_url = "http://127.0.0.1:8081/styles/basic-preview/style.json"
